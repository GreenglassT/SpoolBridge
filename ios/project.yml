name: SpoolBridge
options:
  bundleIdPrefix: com.spoolbridge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: ""

targets:
  SpoolBridge:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SpoolBridge.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.spoolbridge.nfc
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleName: SpoolBridge
        CFBundleDisplayName: SpoolBridge
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NFCReaderUsageDescription: "SpoolBridge uses NFC to write filament data to spool tags."
        NSLocalNetworkUsageDescription: "SpoolBridge connects to your local server to fetch spool data."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
