<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpoolBridge">
<title>Spool Info — SpoolBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base:     #0f1117;
  --bg-panel:    #1a1d27;
  --bg-card:     #22252f;
  --bg-input:    #2a2d3a;
  --bg-hover:    #2f3342;
  --border:      #333848;
  --border-light:#3d4255;
  --text:        #e2e4ea;
  --text-muted:  #7c8298;
  --text-dim:    #505672;
  --accent:      #f97316;
  --accent-hover:#fb923c;
  --accent-dim:  rgba(249, 115, 22, 0.12);
  --green:       #22c55e;
  --green-dim:   rgba(34, 197, 94, 0.12);
  --red:         #ef4444;
  --red-dim:     rgba(239, 68, 68, 0.12);
  --yellow:      #eab308;
  --yellow-dim:  rgba(234, 179, 8, 0.12);
  --blue:        #3b82f6;
  --radius:      6px;
  --mono:        'Fira Code', monospace;
  --sans:        'Fira Sans', -apple-system, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg-base:     #f5f5f7;
    --bg-panel:    #ffffff;
    --bg-card:     #f0f0f3;
    --bg-input:    #e8e8ec;
    --bg-hover:    #e0e0e5;
    --border:      #d1d1d6;
    --border-light:#bbbbc2;
    --text:        #1a1a1e;
    --text-muted:  #6b6b73;
    --text-dim:    #9a9aa3;
    --accent:      #f97316;
    --accent-hover:#fb923c;
    --accent-dim:  rgba(249, 115, 22, 0.10);
    --green:       #16a34a;
    --green-dim:   rgba(22, 163, 74, 0.10);
    --red:         #dc2626;
    --red-dim:     rgba(220, 38, 38, 0.10);
    --yellow:      #ca8a04;
    --yellow-dim:  rgba(202, 138, 4, 0.10);
    --blue:        #2563eb;
  }
}

html { font-size: 15px; }
body {
  background: var(--bg-base);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.shell {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

/* ── Header ──────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.header h1 {
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text);
}
.header h1 span { color: var(--accent); }
.header a {
  font-size: 0.82rem;
  color: var(--text-muted);
  text-decoration: none;
}
.header a:hover { color: var(--accent); }

/* ── Spool Hero ──────────────────────────────────────────── */
.spool-hero {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
}
.spool-hero-top {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  margin-bottom: 20px;
}
.hero-swatch {
  width: 56px;
  height: 56px;
  border-radius: 6px;
  border: 2px solid var(--border);
  flex-shrink: 0;
}
.hero-info { flex: 1; }
.hero-name {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 2px;
}
.hero-vendor {
  font-size: 0.85rem;
  color: var(--text-muted);
}
.hero-id {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-dim);
}

.hero-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat {
  padding: 12px;
  background: var(--bg-card);
  border-radius: var(--radius);
}
.stat-label {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.stat-value {
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 600;
}

/* ── Weight Bar ──────────────────────────────────────────── */
.weight-section {
  margin-top: 16px;
}
.weight-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.weight-bar {
  height: 6px;
  background: var(--bg-input);
  border-radius: 3px;
  overflow: hidden;
}
.weight-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

/* ── Dates ───────────────────────────────────────────────── */
.dates-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

/* ── Assign Tray ─────────────────────────────────────────── */
.section-title {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 12px;
}

.tray-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.tray-slot {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
  transition: border-color 0.15s;
}
.tray-slot.active {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.tray-label {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.tray-occupant {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tray-occupant-swatch {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  border: 1px solid var(--border);
  display: inline-block;
}
.tray-empty {
  font-size: 0.78rem;
  color: var(--text-dim);
  font-style: italic;
}

.ext-slot {
  grid-column: 1 / -1;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius);
  font-size: 0.82rem;
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  width: 100%;
  margin-top: 8px;
}
.btn-assign {
  background: var(--bg-input);
  color: var(--text-muted);
  border-color: var(--border);
}
.btn-assign:hover { color: var(--text); border-color: var(--border-light); background: var(--bg-hover); }
.btn-assign.current {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  cursor: default;
}
.btn-unassign {
  background: transparent;
  color: var(--text-dim);
  border-color: var(--border);
  font-size: 0.78rem;
  margin-top: 12px;
}
.btn-unassign:hover { color: var(--red); border-color: var(--red); }

/* ── AMS Environment ─────────────────────────────────────── */
.env-bar {
  display: flex;
  justify-content: flex-end;
  gap: 16px;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* ── Toast ────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 24px;
  font-size: 0.85rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  opacity: 0;
  transition: all 0.25s;
  z-index: 1000;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.error { border-color: var(--red); color: var(--red); }

/* ── Loading / Error ─────────────────────────────────────── */
.loading {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 20px;
  font-size: 0.9rem;
}
.error-msg {
  text-align: center;
  color: var(--red);
  padding: 60px 20px;
  font-size: 0.9rem;
}

/* ── Dashboard Link ──────────────────────────────────────── */
.dash-link {
  text-align: center;
  margin-top: 20px;
}
.dash-link a {
  font-size: 0.82rem;
  color: var(--text-muted);
  text-decoration: none;
}
.dash-link a:hover { color: var(--accent); }

.btn-load {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-size: 0.9rem;
  padding: 12px 18px;
  margin-top: 16px;
}
.btn-load:hover { background: var(--accent-hover); }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>Spool<span>Bridge</span></h1>
    <a href="/">Dashboard</a>
  </div>

  <div id="content">
    <div class="loading">Loading spool...</div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
const SPOOL_ID = window.location.pathname.split('/').pop();
let currentSpool = null;
let trayMap = {};
let printerStatus = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${r.status}`);
  }
  return r.json();
}

function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => el.className = 'toast', 2500);
}

function formatDate(iso) {
  if (!iso) return '--';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function weightColor(pct) {
  if (pct > 50) return 'var(--green)';
  if (pct > 20) return 'var(--yellow)';
  return 'var(--red)';
}

async function assignTray(tray) {
  try {
    const url = tray
      ? `/api/spools/${SPOOL_ID}/assign-tray/${encodeURIComponent(tray)}`
      : `/api/spools/${SPOOL_ID}/assign-tray`;
    await fetch(url, { method: 'POST' });
    toast(tray ? `Assigned to ${tray}` : 'Unassigned from tray');
    await loadAll();
  } catch (e) {
    toast('Failed to assign tray', true);
  }
}

async function loadExternal() {
  try {
    await api(`/api/load-external/${SPOOL_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    });
    toast('Printer configured — load the spool');
    await loadAll();
  } catch (e) {
    toast('Failed to configure printer', true);
  }
}

async function loadAll() {
  try {
    const [spoolData, trays, status] = await Promise.all([
      api(`/api/tag/${SPOOL_ID}`),
      api('/api/tray-status'),
      api('/api/printer-status'),
    ]);

    if (!spoolData.spool) {
      document.getElementById('content').innerHTML =
        '<div class="error-msg">Spool not found.</div>';
      return;
    }

    currentSpool = spoolData.spool;
    trayMap = trays;
    printerStatus = status;
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="error-msg">Failed to load spool data.</div>';
  }
}

function render() {
  const s = currentSpool;
  const f = s.filament || {};
  const v = f.vendor || {};
  // Find which tray this spool is in
  let myTray = '';
  for (const [key, occ] of Object.entries(trayMap)) {
    if (occ && occ.spool_id === s.id) { myTray = key; break; }
  }

  const remaining = s.remaining_weight || 0;
  const initial = s.initial_weight || f.weight || 1000;
  const pct = Math.round((remaining / initial) * 100);
  const colorHex = (f.color_hex || '888888').replace(/^#/, '');
  const remainingLength = s.remaining_length ? (s.remaining_length / 1000).toFixed(1) + 'm' : '--';

  const env = printerStatus?.ams_environment || {};
  const humidity = env.humidity || '--';
  const temp = env.temp || '--';

  let html = `
    <div class="spool-hero">
      <div class="spool-hero-top">
        <div class="hero-swatch" style="background:#${colorHex}"></div>
        <div class="hero-info">
          <div class="hero-name">${f.name || 'Unknown'} — ${f.material || '?'}</div>
          <div class="hero-vendor">${v.name || 'Generic'}</div>
          <div class="hero-id">#${s.id}</div>
        </div>
      </div>

      <div class="hero-stats">
        <div class="stat">
          <div class="stat-label">Remaining</div>
          <div class="stat-value">${remaining.toFixed(0)}g</div>
        </div>
        <div class="stat">
          <div class="stat-label">Length</div>
          <div class="stat-value">${remainingLength}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Nozzle Temp</div>
          <div class="stat-value">${f.settings_extruder_temp ? f.settings_extruder_temp + '\u00b0' : '--'}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Bed Temp</div>
          <div class="stat-value">${f.settings_bed_temp ? f.settings_bed_temp + '\u00b0' : '--'}</div>
        </div>
      </div>

      <div class="weight-section">
        <div class="weight-labels">
          <span>${pct}% remaining</span>
          <span>${remaining.toFixed(0)}g / ${initial.toFixed(0)}g</span>
        </div>
        <div class="weight-bar">
          <div class="weight-bar-fill" style="width:${pct}%;background:${weightColor(pct)}"></div>
        </div>
      </div>

      <div class="dates-row">
        <span>Registered: ${formatDate(s.registered)}</span>
        <span>Last used: ${formatDate(s.last_used)}</span>
      </div>
    </div>

    <div class="section-title">Assign Tray</div>

    <div class="env-bar">
      <span>Humidity: ${humidity}%</span>
      <span>Temp: ${temp}\u00b0C</span>
    </div>

    <div class="tray-grid">
  `;

  // AMS trays A1-A4 + External
  const slots = [
    { key: 'A1', label: 'Tray 1' },
    { key: 'A2', label: 'Tray 2' },
    { key: 'A3', label: 'Tray 3' },
    { key: 'A4', label: 'Tray 4' },
    { key: 'External', label: 'External Spool', css: ' ext-slot' },
  ];
  for (const slot of slots) {
    const occ = trayMap[slot.key];
    const isMe = myTray === slot.key;
    const occColor = occ ? (occ.color_hex || '888').replace(/^#/, '') : '';

    html += `
      <div class="tray-slot${slot.css || ''}${isMe ? ' active' : ''}">
        <div class="tray-label">${slot.label} — ${occ ? (occ.material || '?') : 'Empty'}</div>
        ${occ ? `
          <div class="tray-occupant">
            <span class="tray-occupant-swatch" style="background:#${occColor}"></span>
            ${occ.name || 'Spool #' + occ.spool_id}
          </div>
          <div class="tray-occupant" style="font-family:var(--mono);font-size:0.72rem;color:var(--text-dim)">
            #${occ.spool_id} &middot; ${(occ.remaining_weight || 0).toFixed(0)}g
          </div>
        ` : '<div class="tray-empty">Empty</div>'}
        <button class="btn btn-assign${isMe ? ' current' : ''}" onclick="${isMe ? '' : `assignTray('${slot.key}')`}">
          ${isMe ? 'Current' : 'Assign'}
        </button>
      </div>
    `;
  }
  html += '</div>';

  // Load External button — configures the printer via MQTT
  html += `
    <button class="btn btn-load" onclick="loadExternal()">
      Load as External Spool
    </button>
  `;

  // Unassign button if currently assigned
  if (myTray) {
    html += `
      <button class="btn btn-unassign" onclick="assignTray('')">
        Unassign from ${myTray}
      </button>
    `;
  }

  html += `
    <div class="dash-link">
      <a href="/">Open full dashboard</a>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
}

loadAll();
</script>
</body>
</html>
